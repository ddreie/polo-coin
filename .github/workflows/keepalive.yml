# Free Supabase projects pause after one week without activity.
# This job calls the database every 3 days so the prototype stays online for grading.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 7 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call api_ping
        run: |
          curl -fsS -X POST "https://fllxsypsclizpjpypnqv.supabase.co/rest/v1/rpc/api_ping" \
            -H "apikey: sb_publishable_jnwQO7PLwiQT6unzCRb0mQ_k3mhQ_8_" \
            -H "Content-Type: application/json" -d '{}'
